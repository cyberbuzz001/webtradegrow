name: Build & Deploy

# The build is the compliance gate. `node build/build.js` exits 1 if any page contains a
# prohibited marketing claim (guaranteed/assured returns, 100% safe, risk-free, zero tax,
# fake urgency). A failing build blocks the deploy, so prohibited copy cannot reach the
# live site even if it is merged.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two Pages deploys at once; don't cancel one mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # No leading slash: Git Bash on Windows rewrites a leading "/" into a drive path,
  # so the builder accepts the bare form and normalises it.
  BASE_PATH: webtradegrow
  SITE_URL: https://cyberbuzz001.github.io

jobs:
  build:
    name: Build (compliance gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build site — fails on any prohibited marketing claim
        run: node build/build.js

      - name: Check internal links
        run: node build/check-links.js

      # Structural accessibility only — no contrast, focus order or screen-reader
      # checks. Passing here does not mean the site is accessible; see the script header.
      - name: Check accessibility (structural)
        run: node build/check-a11y.js

      - name: Report build output
        run: |
          echo "### Build output" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "pages:   $(find dist -name '*.html' | wc -l)" >> "$GITHUB_STEP_SUMMARY"
          echo "files:   $(find dist -type f | wc -l)" >> "$GITHUB_STEP_SUMMARY"
          echo "size:    $(du -sh dist | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          echo "pending: $(grep -roh 'class=\"pending\"' dist --include='*.html' | wc -l) unverified values rendered" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
